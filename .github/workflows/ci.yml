name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and validation tests
        run: pytest -q
      - name: Smoke-run the examples
        run: |
          python examples/jelly_drop.py --quick
          python examples/fingertip.py --quick
          python examples/validation.py --quick
