[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "softfem"
version = "0.1.0"
description = "A compact implicit FEM simulator for hyperelastic soft bodies with IPC-style frictional contact"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ding Yuan" }]
keywords = ["fem", "physics-simulation", "soft-body", "hyperelasticity", "contact", "ipc"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "pillow>=9"]
dev = ["pytest>=7", "matplotlib>=3.7", "pillow>=9"]

[tool.setuptools]
packages = ["softfem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: validation runs that take more than a few seconds"]
